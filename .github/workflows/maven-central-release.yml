name: Publish to Maven Central

# Publishes org.aspose:aspose-slides-foss to Maven Central through the Sonatype Central
# Portal. A release is cut by bumping the version in pom.xml, committing, and pushing a
# tag that matches it:
#
#     git tag v26.8.0 && git push origin v26.8.0
#
# The job then verifies the tag against the POM, scans the tree for committed key
# material, builds and runs the entire test suite, signs the artifacts, publishes them,
# waits until the files are downloadable from repo1.maven.org, and only then creates the
# GitHub Release. Every one of those steps can fail the job. A release workflow that
# reports success without publishing is worse than no release workflow at all.
#
# Running it from the Actions tab instead (workflow_dispatch) does the same build without
# deploying anything, which is how a release is checked before the tag is pushed.
#
# Re-running a tag is safe. If the version is already on Maven Central the build and the
# deploy are skipped, and the remaining steps still run - so a release that published but
# then failed on a later step can be finished by re-running it, without inventing a new
# version number.
#
# Actions are pinned to a commit SHA rather than to a tag. A tag is a movable pointer -
# whoever controls the action repository can repoint v4 at different code, and every
# workflow that references it starts running that code without a single change here. A
# commit SHA cannot be repointed. The tag each SHA carried when it was pinned is in the
# comment beside it; to upgrade, resolve the new tag to its SHA and replace both.

on:
  push:
    tags: ['v*', 'V*']
  workflow_dispatch:

permissions:
  contents: write            # needed to create the GitHub Release

jobs:

  # ---------------------------------------------------------------------------
  # Dry run: the release build, minus the signing and the publishing.
  # ---------------------------------------------------------------------------
  dry-run:
    name: Dry-run build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Guard the Maven coordinates
        run: |
          set -euo pipefail
          GID="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.groupId)"
          AID="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.artifactId)"
          VER="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          [ "$GID" = "org.aspose" ] || { echo "::error::groupId must be org.aspose (got $GID)"; exit 1; }
          [ "$AID" = "aspose-slides-foss" ] || { echo "::error::artifactId must be aspose-slides-foss (got $AID)"; exit 1; }
          case "$VER" in
            *-SNAPSHOT|*-alpha*|*-beta*|*-rc*)
              echo "::error::pre-release versions cannot be published to Maven Central ($VER)"; exit 1 ;;
          esac
          echo "Coordinates: ${GID}:${AID}:${VER}"

      - name: Scan the tree for committed key material
        run: |
          set -euo pipefail
          # The two patterns are written so that this file does not match itself: a real
          # key block contains neither an alternation nor a character class, so the
          # literal text below is not matched by the regular expression it spells out.
          # Verified by running the scan against a file holding a real key block, and
          # against this file alone.
          if git grep -nIE \
               -e '-----BEGIN [A-Z ]*(PRIVATE|SECRET) KEY' \
               -e 'BEGIN PGP (PRIVATE|PUBLIC) KEY BL[O]CK' -- .; then
            echo "::error::key material is committed in this repository - see the matches above"
            exit 1
          fi
          echo "No key material found in tracked files."

      # The full test suite runs here. It is the only thing standing between a tag and a
      # published artifact, so it is never skipped.
      - name: Build, test and package
        run: mvn -B --no-transfer-progress clean verify -Dgpg.skip=true

      - name: Verify the three jars were produced
        run: |
          set -euo pipefail
          AID="aspose-slides-foss"
          VER="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          for f in "target/${AID}-${VER}.jar" \
                   "target/${AID}-${VER}-sources.jar" \
                   "target/${AID}-${VER}-javadoc.jar"; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
            echo "  $(sha256sum "$f")"
          done

      - name: Verify the build left the working tree clean
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          [ -z "$(git ls-files --others --exclude-standard)" ] \
            || { echo "::error::the build created untracked files: $(git ls-files --others --exclude-standard)"; exit 1; }

      - run: echo "::notice::Dry run only - nothing was signed and nothing was deployed."

  # ---------------------------------------------------------------------------
  # Release: build, sign, publish, confirm.
  # ---------------------------------------------------------------------------
  release:
    name: Build, sign and publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21 and import the signing key
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Guard the coordinates and match the tag to the POM version
        id: coordinates
        run: |
          set -euo pipefail
          GID="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.groupId)"
          AID="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.artifactId)"
          VER="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          [ "$GID" = "org.aspose" ] || { echo "::error::groupId must be org.aspose (got $GID)"; exit 1; }
          [ "$AID" = "aspose-slides-foss" ] || { echo "::error::artifactId must be aspose-slides-foss (got $AID)"; exit 1; }
          case "$VER" in
            *-SNAPSHOT|*-alpha*|*-beta*|*-rc*)
              echo "::error::pre-release versions cannot be published to Maven Central ($VER)"; exit 1 ;;
          esac
          TAG="${{ github.ref_name }}"
          TAG_VER="${TAG#[vV]}"
          [ "$TAG_VER" = "$VER" ] \
            || { echo "::error::tag $TAG does not match the pom.xml version $VER"; exit 1; }
          {
            echo "version=$VER"
            echo "artifact=$AID"
            echo "base=https://repo1.maven.org/maven2/org/aspose/${AID}/${VER}/${AID}-${VER}"
          } >> "$GITHUB_OUTPUT"
          echo "Coordinates: ${GID}:${AID}:${VER} (tag ${TAG})"

      - name: Scan the tree for committed key material
        run: |
          set -euo pipefail
          # See the identical step in the dry-run job for why these patterns do not
          # match the file they are written in.
          if git grep -nIE \
               -e '-----BEGIN [A-Z ]*(PRIVATE|SECRET) KEY' \
               -e 'BEGIN PGP (PRIVATE|PUBLIC) KEY BL[O]CK' -- .; then
            echo "::error::key material is committed in this repository - see the matches above"
            exit 1
          fi
          echo "No key material found in tracked files."

      # Deciding whether there is anything to do. Finding the version already published
      # is not an error: it is what a re-run of a release that half-failed looks like,
      # and the remaining steps still need to run. Anything other than a plain 200 or
      # 404 - a proxy error, a network failure, an empty reply - is an error, because
      # treating it as "not published" would publish on top of a version that may exist.
      - name: Find out whether this version is already on Maven Central
        id: central
        run: |
          set -euo pipefail
          URL="${{ steps.coordinates.outputs.base }}.jar"
          STATUS="$(curl -sS --retry 3 --retry-all-errors --max-time 60 \
                      -o /dev/null -w '%{http_code}\n' "$URL" | tail -n 1 || true)"
          # curl writes one status line per attempt, so only the last one is the answer;
          # an attempt that never got a reply writes 000, which is not 200 or 404 and so
          # is treated as "do not know".
          case "$STATUS" in
            200)
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "::notice::${{ steps.coordinates.outputs.version }} is already on Maven Central - the build and the deploy will be skipped, the rest of the release will be completed" ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              echo "Version ${{ steps.coordinates.outputs.version }} is not on Maven Central yet." ;;
            *)
              echo "::error::could not determine whether ${URL} exists (HTTP ${STATUS})"
              exit 1 ;;
          esac

      # One command: it compiles, runs the entire test suite, builds the sources and
      # javadoc jars, signs everything and uploads it to the Central Portal. Because
      # `deploy` runs after `test` in the Maven lifecycle, a failing test stops the
      # release. Tests are never skipped here - a build that is not judged is not a
      # release, it is a file transfer.
      #
      # The POM sets waitUntil=published, so this command does not return until the
      # Portal reports the version published. A failed publication fails this step.
      - name: Build, test, sign and deploy
        if: steps.central.outputs.published == 'false'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B --no-transfer-progress clean deploy

      - name: Verify the six artifacts that were uploaded
        if: steps.central.outputs.published == 'false'
        run: |
          set -euo pipefail
          AID="${{ steps.coordinates.outputs.artifact }}"
          VER="${{ steps.coordinates.outputs.version }}"
          for f in "target/${AID}-${VER}.jar" \
                   "target/${AID}-${VER}-sources.jar" \
                   "target/${AID}-${VER}-javadoc.jar" \
                   "target/${AID}-${VER}.jar.asc" \
                   "target/${AID}-${VER}-sources.jar.asc" \
                   "target/${AID}-${VER}-javadoc.jar.asc"; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          sha256sum "target/${AID}-${VER}.jar" \
                    "target/${AID}-${VER}-sources.jar" \
                    "target/${AID}-${VER}-javadoc.jar"

      - name: Verify the build left the working tree clean
        if: steps.central.outputs.published == 'false'
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          [ -z "$(git ls-files --others --exclude-standard)" ] \
            || { echo "::error::the build created untracked files: $(git ls-files --others --exclude-standard)"; exit 1; }

      # The Portal reporting a version published and repo1.maven.org actually serving it
      # are two different facts, separated by a sync that usually takes minutes. Until a
      # plain HTTP GET returns the files, no developer can depend on this release, so
      # this step waits for them and fails if they never appear. It is the check that
      # decides whether the release succeeded, so it must not be downgraded to a warning.
      - name: Wait until the files are downloadable from Maven Central
        run: |
          set -euo pipefail
          MISSING=0
          for SUFFIX in ".pom" ".jar" "-sources.jar" "-javadoc.jar" ".jar.asc"; do
            URL="${{ steps.coordinates.outputs.base }}${SUFFIX}"
            echo "Polling ${URL}"
            FOUND=0
            for i in $(seq 1 15); do
              STATUS="$(curl -sS --max-time 60 -o /dev/null -w '%{http_code}' "$URL" || echo "000")"
              if [ "$STATUS" = "200" ]; then
                echo "  present after $(( (i - 1) * 2 )) minutes"
                FOUND=1
                break
              fi
              echo "  attempt ${i}/15: HTTP ${STATUS}"
              if [ "$i" -lt 15 ]; then sleep 120; fi
            done
            if [ "$FOUND" -eq 0 ]; then
              echo "::error::${URL} is still not served by Maven Central after 28 minutes"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "::error::the release did not land on Maven Central"
            exit 1
          fi
          echo "All files are downloadable from Maven Central."

      # Last, so that the presence of a GitHub Release means the version really is
      # published and downloadable, and not merely that a tag was pushed.
      - name: Create the GitHub Release
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "Release $TAG" \
              --generate-notes \
              --latest
            echo "Created GitHub Release $TAG."
          fi
