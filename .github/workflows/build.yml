name: Build and test

# The release workflow builds with -DskipTests, because its job is to publish an
# artifact and not to judge one. Nothing else ran the test suite, so a change could
# reach a published release without a single test having been executed. This runs it
# on every push and every pull request.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: mvn verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Runs the tests, and builds the jar, sources and javadoc the release also
      # builds, so a javadoc error is caught here rather than at publish time.
      # Signing is skipped: there is no key here and none is needed to test.
      - name: Build and test
        run: mvn -B clean verify -Dgpg.skip=true

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
